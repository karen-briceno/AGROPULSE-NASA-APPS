<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroPulse XAI</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10281c;--ink2:#35503f;--glass:rgba(255,255,255,.45);--glass2:rgba(255,255,255,.7);--edge:rgba(255,255,255,.8);--shadow:rgba(20,60,40,.2);--g1:#23904f;--gold:#e6a92c;--sky:#2a6fb5;--bg1:#bfe3c4;--bg2:#f4e3a6;--bg3:#9fcde8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef9f1;--ink2:#bcd3c4;--glass:rgba(20,40,30,.5);--glass2:rgba(30,56,42,.72);--edge:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.5);--bg1:#0f3322;--bg2:#3d3513;--bg3:#0f2b44}}
:root[data-theme="dark"]{--ink:#eef9f1;--ink2:#bcd3c4;--glass:rgba(20,40,30,.5);--glass2:rgba(30,56,42,.72);--edge:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.5);--bg1:#0f3322;--bg2:#3d3513;--bg3:#0f2b44}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;font-size:18px;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,var(--bg3),var(--bg1) 45%,var(--bg2)) fixed;padding-bottom:130px;overflow-x:hidden}
.orb{position:fixed;z-index:-1;border-radius:50%;filter:blur(50px)}.o1{width:320px;height:320px;background:var(--gold);top:8%;right:-80px;opacity:.45}.o2{width:380px;height:380px;background:var(--g1);bottom:10%;left:-120px;opacity:.5}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--edge);border-radius:28px;box-shadow:0 10px 36px var(--shadow),inset 0 1px 0 rgba(255,255,255,.5)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:10px auto;max-width:820px;width:calc(100% - 24px);display:flex;align-items:center;gap:10px;padding:8px 14px}
header h1{font:800 1.2rem 'Bricolage Grotesque',sans-serif;margin:0}header small{display:block;color:var(--ink2);font-size:.75rem}.sp{flex:1}
main{max-width:820px;margin:0 auto;padding:0 12px}
.card{padding:20px;margin-bottom:14px}
.paso{color:var(--ink2);font-weight:600;font-size:.9rem}
h2{font:800 1.8rem/1.12 'Bricolage Grotesque',sans-serif;margin:2px 0 8px}h3{margin:0 0 8px;font-size:1.15rem}
p{line-height:1.5;margin:6px 0}.mut{color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn,.pill,.in{font:inherit;color:var(--ink);border:1px solid var(--edge);background:var(--glass2);border-radius:99px;padding:12px 18px;min-height:48px}
.btn,.pill{cursor:pointer}.pill.on{background:var(--g1);color:#fff;border-color:transparent;font-weight:700}
.in{border-radius:16px;width:100%;margin:6px 0 14px}
.listen{background:var(--sky);color:#fff;font-weight:700;border-color:transparent;width:100%;font-size:1.05rem}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:8px 0}.tiles.sm{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.tile{position:relative;font:inherit;color:var(--ink);cursor:pointer;background:var(--glass2);border:3px solid var(--edge);border-radius:22px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tile small{color:var(--ink2);font-size:.82rem;line-height:1.25}.tile .e{font-size:2rem;line-height:1.1}
.tile.on{border-color:var(--g1);box-shadow:0 0 0 4px rgba(35,144,79,.28)}.tile.on::after{content:"✔";position:absolute;top:6px;right:10px;color:var(--g1);font-weight:800}
.why{padding:14px;border-radius:20px;background:var(--glass2);border:2px dashed var(--edge);margin-bottom:14px}.why p{margin:4px 0}
.tag{display:inline-block;font-size:.8rem;padding:3px 10px;border-radius:99px;background:rgba(42,111,181,.2);margin-top:4px}.tag.s{background:rgba(35,144,79,.25)}
.map{position:relative;aspect-ratio:600/430;border-radius:22px;overflow:hidden;border:1px solid var(--edge)}.map svg,.map .L{position:absolute;inset:0;width:100%;height:100%}.map .L svg{position:static}
.chipm{position:absolute;top:8px;z-index:2;background:#fff;color:#10281c;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px}
.legend{font-size:.9rem;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;background:var(--c)}
input[type=range]{width:100%;height:36px;accent-color:var(--g1)}
.sl{margin:18px 0}.sl label{display:flex;justify-content:space-between;gap:8px;font-weight:600;align-items:center}.sl output{background:var(--glass2);border:1px solid var(--edge);border-radius:99px;padding:4px 12px;white-space:nowrap}
.tl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.yr{background:var(--glass2);border:1px solid var(--edge);border-radius:18px;padding:6px 10px;text-align:center;min-width:70px}.yr b{display:block;font-size:2.1rem;line-height:1.2}.yr span{font-size:.78rem;color:var(--ink2)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.opt{padding:16px;border-radius:24px;background:var(--glass2);border:2px solid var(--edge)}.opt.best{border-color:var(--gold);box-shadow:0 0 0 4px rgba(230,169,44,.25)}
.badge{display:inline-block;background:var(--gold);color:#3a2a00;font-weight:700;border-radius:99px;padding:4px 12px;font-size:.85rem;margin-bottom:6px}
.lines div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--edge)}
.sem{display:flex;gap:12px;align-items:center;padding:14px;border-radius:22px;background:var(--glass2);border:1px solid var(--edge);margin-bottom:10px}.sem .l{font-size:2rem}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;text-align:center;font-size:.72rem}.cal div{border-radius:10px;padding:6px 0;background:var(--glass2)}.cal i{display:block;font-style:normal;font-size:1.2rem}
.ex{display:none;margin-top:8px;padding:14px;border-radius:18px;background:var(--glass2);border:2px dashed var(--edge)}.ex.on{display:block}
.d100{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:280px;margin:10px 0}.d100 i{aspect-ratio:1;border-radius:5px}
.dots{display:flex;gap:6px;flex:1;justify-content:center}.dots button{width:14px;height:14px;padding:0;border-radius:50%;border:1px solid var(--edge);background:var(--glass2);cursor:pointer}.dots button.on{background:var(--g1);width:30px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;width:calc(100% - 20px);max-width:620px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:36px}
.nav .btn{font-weight:700}.nav .next{background:var(--g1);color:#fff;border-color:transparent;padding:12px 22px}
.big{font:800 2.2rem/1 'Bricolage Grotesque',sans-serif}
.fin{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:20px;background:var(--glass2);border:1px solid var(--edge);margin-bottom:10px;cursor:pointer}.fin input{width:28px;height:28px;accent-color:var(--g1);flex:none}
.view{animation:in .35s ease}@keyframes in{from{opacity:0;transform:scale(.98)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<header class="glass">
<svg width="42" height="42" viewBox="0 0 64 64" role="img" aria-label="Logo AgroPulse">
<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6fb5"/><stop offset="1" stop-color="#2f9e63"/></linearGradient><clipPath id="cp"><circle cx="32" cy="32" r="22"/></clipPath></defs>
<circle cx="32" cy="32" r="22" fill="url(#gl)"/><g clip-path="url(#cp)" stroke="#f4e3a6" stroke-width="1.6" fill="none" opacity=".75"><path d="M6 46Q32 38 58 46"/><path d="M6 52Q32 44 58 52"/><path d="M6 58Q32 50 58 58"/></g>
<path d="M32 44V28" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M32 33C25 33 22 28 22 23c6 0 10 3 10 10z" fill="#c9f2b5"/><path d="M32 29c0-6 3-10 10-10 0 6-4 10-10 10z" fill="#fff"/>
<ellipse cx="32" cy="32" rx="30" ry="9" transform="rotate(-24 32 32)" fill="none" stroke="#e6a92c" stroke-width="2.6"/><circle cx="56" cy="21" r="3.6" fill="#e6a92c" stroke="#fff" stroke-width="1.2"/></svg>
<div><h1>AgroPulse XAI</h1><small>Tu chacra vista desde el espacio</small></div><div class="sp"></div><span style="font-size:1.6rem" title="Datos de NASA y USDA">🛰️</span>
</header>
<main id="main"></main>
<nav class="nav glass"><button class="btn" id="back">◀ Atrás</button><div class="dots" id="dots"></div><button class="btn next" id="next">Siguiente ▶</button></nav>

<script>
const REG=["Cusco","Puno","Junín","Ayacucho","Huancavelica","Apurímac","Arequipa","Cajamarca","Áncash","Lima (provincias)","Ica","La Libertad","Piura","San Martín","Otra región"];
const CM={maíz:["🌽","Da buena cosecha, pero gasta mucho abono de la tierra."],papa:["🥔","Deja buena ganancia, pero la tierra queda suelta y la lluvia se la lleva."],haba:["🫘","Deja abono natural en la tierra."],arveja:["🫛","Deja abono natural y deja descansar a la tierra."],quinua:["🌱","Aguanta la sequía y gasta poca agua."],avena:["🌾","Cubre el suelo y frena la lluvia: protege la tierra."],hortalizas:["🥬","Dan buena ganancia, pero piden mucha agua."],alfalfa:["🌿","Cubre la tierra por años y deja abono natural."],nada:["🟫","Tierra descubierta: la lluvia y el sol la desgastan."]};
const FIX=[{n:"Cuidar el agua y la tierra",ic:"💧",d:"Rotas con cultivos que protegen y alimentan la tierra.",rot:["maíz","quinua","haba","avena"],s:[8,9,8,5,8],f:.55,cs:.6},{n:"Ganar más y resistir mejor",ic:"💰",d:"Mezclas cultivos de buena venta con haba, que abona.",rot:["maíz","papa","haba","maíz"],s:[6,6,7,9,6],f:.78,cs:.8}];
const CRIT=[["gaste poca agua","💧","Lo vio el satélite (humedad y lluvia)","s"],["no se lleve la tierra la lluvia","🟤","Lo vio el satélite (terreno y suelo)","s"],["la tierra tenga abono natural","🌿","Lo vio el satélite (verdor de tus cultivos)","s"],["me deje buena ganancia","💰","Es un supuesto: precios de la zona","a"],["haya menos plagas","🐛","Es un supuesto: experiencia de la zona","a"]];
const SH=["Agua","Tierra","Abono","Ganancia","Plagas"],PESO=["Nada","Poco","Normal","Importante","Muy importante"],FACE=["😐","🙂","😀","🤩","🤩"];
const GLOSS={mapa:"Dividimos tu chacra en cuadritos de 30 por 30 metros, más o menos medio campo de fútbol chico. Verde: ahí va bien. Rojo: ahí se pierde agua o tierra.",prio:"Tú mandas. Si lo que más te importa es el agua, suben las opciones que ahorran agua. Si es la ganancia, suben las que dan más plata.",desnuda:"Cuando la tierra queda sin cultivo, la lluvia y el viento se llevan lo mejor del suelo, como cuando barres una mesa.",tierra:"Es la tierra buena que se lleva la lluvia, sobre todo en cerros. Una tormenta fuerte puede llevarse el abono de varios meses.",clima:"Probamos cómo le iría a cada opción en un año seco, normal o lluvioso. Así ves cuál aguanta mejor los años malos."};
const S={i:0,name:"",zona:"sierra",region:"Cusco",area:2,unit:"ha",terr:1,river:true,soil:1,agua:0,prob:[],crops:["maíz","maíz","papa"],w:[4,4,3,4,3],rain:0,temp:0,sel:1,ba:50,chk:[0,0,0,0]};
const $=q=>document.querySelector(q),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const who=()=>S.name.trim()?esc(S.name.trim()):"amigo";
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const COLS=12,ROWS=8,AREA=()=>S.unit=="ha"?S.area*1e4:S.area;
const areaTxt=()=>S.unit=="ha"?`${S.area} ${S.area==1?"hectárea":"hectáreas"}`:`${S.area} m²`;
function info(){const A=AREA(),w=Math.sqrt(A*1.5),h=A/w;return`📏 Mide más o menos ${Math.round(w)} × ${Math.round(h)} metros · ⚽ como ${(A/7000).toFixed(1)} canchas de fútbol · 🔲 unos ${Math.ceil(A/900)} cuadritos de 30 × 30 m`}
function scoreRot(r){const s=[5,5,5,6,5],ec={maíz:6,papa:8,haba:6,arveja:6,quinua:7,avena:4,hortalizas:8,alfalfa:5,nada:1};
 r.forEach((c,i)=>{if(["haba","arveja","alfalfa"].includes(c)){s[2]+=1.8;s[4]+=.6}if(["avena","alfalfa","quinua"].includes(c)){s[1]+=1.6;s[0]+=.8}if(["maíz","papa","hortalizas"].includes(c)){s[1]-=1;s[2]-=.5}if(c=="nada"){s[1]-=2;s[0]-=1}if(c=="hortalizas")s[0]-=1.2;if(i&&c==r[i-1]&&c!="nada"){s[4]-=1.6;s[2]-=1}});
 s[3]=r.reduce((a,c)=>a+ec[c],0)/r.length;return s.map(v=>clamp(Math.round(v*2)/2,1,10))}
const ST=()=>[{n:"Seguir como estoy",ic:"🔁",d:"Sigues sembrando como en los últimos 3 años.",rot:S.crops,s:scoreRot(S.crops),f:1,cs:1},...FIX];
function baseGrid(){const r=rng(REG.indexOf(S.region)*13+S.terr*5+S.soil*3+1),sl=[.1,.35,.65][S.terr],g=[];for(let i=0;i<ROWS;i++){g[i]=[];for(let j=0;j<COLS;j++)g[i][j]=clamp(.1+sl*(1-i/ROWS)*.9+(S.soil==0?.1:0)+(S.soil==2?.15*(i/ROWS)**2:0)+(S.prob.includes("erosion")?.08:0)+r()*.18)}return g}
const risk=(b,k,rain,temp)=>{const st=ST()[k],dry=Math.max(0,-rain)/40*.22+Math.max(0,rain)/30*.05+temp*.05;return clamp(b*st.f+dry*st.cs*(.4+b*1.1))};
function col(v){const c=v<.5?[63+167*v*2,174+18*v*2,106-62*v*2]:[230-18*(v-.5)*2,192-110*(v-.5)*2,44+3*(v-.5)*2];return`rgba(${c.map(Math.round)},.8)`}
const mean=(g,f)=>{let s=0;g.forEach(r=>r.forEach(v=>s+=f(v)));return s/(ROWS*COLS)};
const pin=(x,y,e,t)=>{x=clamp(x,75,525);const w=t.length*6.6+18;return`<g><rect x="${x-w/2}" y="${y+4}" width="${w}" height="22" rx="11" fill="#fff" opacity=".93"/><text x="${x}" y="${y+19}" text-anchor="middle" font-size="12" font-weight="700" fill="#10281c">${t}</text><text x="${x}" y="${y}" text-anchor="middle" font-size="26">${e}</text></g>`};
function field(fn,pins){const x0=40,y0=48,fw=520,fh=320,cw=fw/COLS,ch=fh/ROWS,T="text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#10281c\"";
 let s=`<svg viewBox="0 0 600 430" width="100%" role="img" aria-label="Dibujo de tu chacra visto desde arriba"><rect width="600" height="430" fill="#cfe8c4"/>`;
 if(S.river)s+=`<path d="M0 392Q75 374 150 394T300 394T450 392T600 390V430H0Z" fill="#4a9fd8"/><text x="300" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">💧 Río o acequia</text>`;
 s+=`<rect x="${x0-6}" y="${y0-6}" width="${fw+12}" height="${fh+12}" rx="14" fill="#8a5a33"/><rect x="${x0}" y="${y0}" width="${fw}" height="${fh}" rx="10" fill="#b98a5a"/>`;
 let hi=[0,0,-1],lo=[0,0,2];
 for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){const v=fn?fn(i,j):0,x=x0+j*cw,y=y0+i*ch;if(v>hi[2])hi=[i,j,v];if(v<lo[2])lo=[i,j,v];
  s+=`<rect x="${x+1}" y="${y+1}" width="${cw-2}" height="${ch-2}" rx="4" fill="${fn?col(v):"rgba(120,190,110,.38)"}"/>`;
  if(!fn)s+=`<text x="${x+cw/2}" y="${y+ch*.7}" text-anchor="middle" font-size="22">${CM[S.crops[2]][0]}</text>`}
 s+=`<text x="300" y="32" ${T}>${S.terr?"⬆ PARTE ALTA (cerro)":"🌾 Terreno plano"}</text>`;
 if(S.terr){s+=`<text transform="translate(586 ${y0+fh/2}) rotate(90)" ${T}>💧 el agua baja →</text>`;if(!S.river)s+=`<text x="300" y="396" ${T}>⬇ PARTE BAJA</text>`}
 if(!fn)s+=pin(300,215,"📍","Tu chacra: "+S.area+(S.unit=="ha"?" ha":" m²"));
 else if(pins){const c=(p)=>[x0+p[1]*cw+cw/2,y0+p[0]*ch+ch/2];s+=pin(...c(lo),"✅","Aquí va mejor")+pin(...c(hi),"❌","Aquí se pierde más")}
 return s+"</svg>"}
const mapBox=(id,fn,pins)=>`<div class="map" id="${id}">${field(fn,pins)}</div>`;
const LEG=`<div class="legend"><span style="--c:#3fae6a">✅ Va bien</span><span style="--c:#e6c02c">⚠️ Cuidado</span><span style="--c:#d4522f">❌ Se pierde agua o tierra</span></div>`;
function speak(t){if(!window.speechSynthesis)return alert("Tu celular o navegador no tiene lectura en voz alta.");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-PE";u.rate=.9;speechSynthesis.speak(u)}
const exp=k=>`<div style="margin-top:10px"><button class="btn" data-ex="${k}">💬 Explícamelo simple</button></div><div class="ex" id="ex-${k}"><p>${GLOSS[k]}</p><button class="btn" data-say="${k}">🔊 Escuchar</button></div>`;
const head=(lab,t,say)=>`<div class="card glass"><div class="paso">${lab}</div><h2>${t}</h2><button class="btn listen" data-speak="${esc(say)}">🔊 Escuchar esta pantalla</button></div>`;
const why=(t,src)=>`<div class="why"><b>🤔 ¿Para qué te lo pregunto?</b><p>${t}</p><span class="tag s">🛰️ ${src}</span></div>`;
const tile=(k,v,on,inner)=>`<button class="tile" data-set="${k}:${v}" aria-pressed="${on}" ${on?'style="--x:1"':''} onclick="" ${on?'':''}>${inner}</button>`.replace('class="tile"',`class="tile ${on?"on":""}"`);
function topsis(w,M){const sw=w.reduce((a,b)=>a+b,0),W=w.map(x=>x/sw),nm=[];for(let j=0;j<5;j++){const d=Math.sqrt(M.reduce((a,r)=>a+r[j]**2,0));nm.push(M.map(r=>r[j]/d*W[j]))}
 const bt=nm.map(c=>Math.max(...c)),ws=nm.map(c=>Math.min(...c));return M.map((_,i)=>{let dp=0,dm=0;for(let j=0;j<5;j++){dp+=(nm[j][i]-bt[j])**2;dm+=(nm[j][i]-ws[j])**2}return Math.sqrt(dm)/(Math.sqrt(dp)+Math.sqrt(dm)||1)})}
const M0=()=>ST().map(s=>s.s),best=()=>{const s=topsis(S.w,M0());return s.indexOf(Math.max(...s))};
function boot(){const r=rng(5),w=[];for(let t=0;t<100;t++){const M=M0().map(row=>row.map((v,j)=>clamp(v+(r()*2-1)*(j>2?2:1.3),1,10)));const s=topsis(S.w,M);w.push(s.indexOf(Math.max(...s)))}return w}
const word=v=>v>=7?["✅","Muy bien"]:v>=5?["⚠️","Regular"]:["❌","Mal"];
const lvl=v=>v>.5?["🔴","Alto"]:v>.35?["🟡","Medio"]:["🟢","Bajo"];
const tlr=(rot,labs)=>`<div class="tl">${rot.map((c,i)=>`${i?'<span>➜</span>':''}<div class="yr"><b>${CM[c][0]}</b><span>${labs?labs[i]+"<br>":""}${c}</span></div>`).join("")}</div>`;
const CL3=["Hace 3 años","Hace 2 años","El año pasado"];
function cropTips(r){const t=[];for(let i=1;i<3;i++)if(r[i]==r[i-1]&&r[i]!="nada"){t.push(`🔁 Sembraste ${r[i]} dos años seguidos: eso cansa la tierra y llama plagas.`);break}
 if(!r.some(c=>["haba","arveja","alfalfa"].includes(c)))t.push("🫘 No sembraste haba ni arveja: la tierra no recibió abono natural.");

 $("#res").innerHTML=`<h3>Pedazos de tu chacra en peligro</h3>`+ST().map((s,i)=>{const n=Math.round(mean(b,x=>risk(x,i,S.rain,S.temp)>.5?1:0)*10);return`<div style="margin:12px 0"><b>${s.ic} ${s.n}</b><div style="font-size:1.2rem">${"🟥".repeat(n)}${"⬜".repeat(10-n)}</div><span class="mut">${n} de cada 10 pedazos sufrirían</span></div>`}).join("")}
function go(n,keep){S.i=clamp(n,0,13);speechSynthesis&&speechSynthesis.cancel();$("#main").innerHTML=`<section class="view">${SCR[S.i]()}</section>`;
 const p1=S.i<6,cnt=p1?6:8,off=p1?0:6;$("#dots").innerHTML=[...Array(cnt)].map((_,k)=>`<button data-go="${off+k}" class="${off+k==S.i?"on":""}" aria-label="Ir a ${k+1}"></button>`).join("");
 $("#back").style.visibility=S.i?"visible":"hidden";$("#next").style.visibility=S.i<13?"visible":"hidden";$("#next").textContent=S.i==5?"Ver mi chacra ▶":"Siguiente ▶";
 if(S.i==8)liveUpd();if(S.i==9)ba();if(S.i==10)clima();if(!keep)scrollTo({top:0})}
$("#back").onclick=()=>go(S.i-1);$("#next").onclick=()=>go(S.i+1);
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.go!=null)go(+d.go);else if(d.ex)$("#ex-"+d.ex).classList.toggle("on");else if(d.say)speak(GLOSS[d.say]);else if(d.speak)speak(d.speak);
 else if(d.set){const[k,v]=d.set.split(":");S[k]=/^\d+$/.test(v)?+v:v;go(S.i,true)}
 else if(d.tog){const[k,v]=d.tog.split(":"),a=S[k],x=a.indexOf(v);x<0?a.push(v):a.splice(x,1);go(S.i,true)}
 else if(d.crop){const[k,v]=d.crop.split(":");S.crops[+k]=v;go(S.i,true)}
 else if(d.area){S.area=+d.area;S.unit="ha";go(S.i,true)}
 else if(d.sel){S.sel=+d.sel;go(9,true)}
 else if(d.clima){const a=d.clima.split(",");S.rain=+a[0];S.temp=+a[1];go(10,true)}
 else if(d.copy){const s=ST()[best()],txt=`Plan de ${S.name||"mi chacra"}: ${s.n}. Siembra ${s.rot.join(" → ")}.\n`+advice().map(a=>a[0]+" "+a[1]).join("\n");try{navigator.clipboard.writeText(txt).then(()=>{t.textContent="✅ Copiado"})}catch(_){prompt("Copia tu plan:",txt)}}});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id=="name")S.name=t.value;else if(t.id=="area"){S.area=Math.max(.1,+t.value||1);$("#areaInfo").textContent=info()}
 else if(t.dataset.w!=null){const i=+t.dataset.w;S.w[i]=+t.value;$("#wv"+i).textContent=FACE[S.w[i]-1]+" "+PESO[S.w[i]-1];liveUpd()}
 else if(t.id=="rain"){S.rain=+t.value;clima()}else if(t.id=="temp"){S.temp=+t.value;clima()}else if(t.id=="bas"){S.ba=+t.value;ba()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id=="region")S.region=t.value;else if(t.id=="unit"){S.unit=t.value;$("#areaInfo").textContent=info()}else if(t.id=="river")S.river=t.checked;
 else if(t.dataset.chk!=null){S.chk[+t.dataset.chk]=t.checked?1:0;go(13,true)}});
go(0);
</script>
</body>
